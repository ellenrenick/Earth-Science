<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Earth Science Review</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2733;--mute:#5b6b7c;--line:#d9e1ea;--brand:#1f5fa8;
--need:#b4341f;--needbg:#fdeeea;--ok:#8a5a00;--okbg:#fff6df;--mast:#1b6b3a;--mastbg:#e5f5ea;--na:#4a5663;--nabg:#eceff3;--water:#d4e9f7;--oc:#46566a;--cont:#d2b277;--cont2:#b8975a;--mantle:#fbe9d8;--magma:#e5683c;--cn:#4b5d78;--cr:#ecd9a0}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8eef5;--mute:#9fb0c1;--line:#2b3846;--brand:#6fb1ff;
--need:#ff9a86;--needbg:#3a1f1a;--ok:#f3c65f;--okbg:#352b10;--mast:#7fd89f;--mastbg:#14301f;--na:#b6c2cf;--nabg:#222d39;--water:#1c3a52;--oc:#8da2ba;--cont:#8a6f3d;--cont2:#a98a50;--mantle:#3a2a22;--magma:#ff8a5c;--cn:#7f93b0;--cr:#7d6a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;margin:.2em 0}
h2{font-size:1.2rem;margin:1.6em 0 .5em}
.sub{color:var(--mute);margin:0 0 1em}
form{display:flex;gap:8px;flex-wrap:wrap;margin:1em 0}
input[type=text]{flex:1 1 240px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button,.btn{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand);padding:8px 14px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.msg{background:var(--needbg);color:var(--need);padding:12px 14px;border-radius:10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▸";margin-left:auto;color:var(--mute);transition:transform .15s}
.card[open]>summary::after{transform:rotate(90deg)}
.tid{font-weight:700;color:var(--brand);min-width:3.2em}
.goal{flex:1}
.pill{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.need{background:var(--needbg);color:var(--need)}.ok{background:var(--okbg);color:var(--ok)}
.mast{background:var(--mastbg);color:var(--mast)}.na{background:var(--nabg);color:var(--na)}
.body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.body h3{font-size:1.05rem;margin:1.3em 0 .3em}
.body table{border-collapse:collapse;width:100%;font-size:.95rem;display:block;overflow-x:auto}
.body td,.body th{border:1px solid var(--line)!important;padding:6px 8px;text-align:left;vertical-align:top}
.body details{background:var(--nabg);border-radius:8px;padding:6px 12px;margin:6px 0 10px}
.body summary{cursor:pointer;font-weight:600;color:var(--brand)}
.body div[style*="background"]{background:var(--nabg)!important;border-left-color:var(--brand)!important}
.cfa{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:.9rem;color:var(--mute)}
[hidden]{display:none!important}

.try{background:var(--nabg);border-radius:10px;padding:10px 12px;margin:6px 0 14px}
.try label,.q label{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:4px}
textarea{width:100%;font:inherit;font-size:.95rem;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical;min-height:2.6em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button{padding:7px 14px;font-size:.9rem}
.key{background:var(--card);border-left:4px solid var(--brand);padding:8px 12px;border-radius:6px;margin-top:8px}
.key p{margin:0}
button.got{background:var(--mast);color:#fff}
button.again{color:var(--need);border-color:var(--need)}
.res{margin:6px 0 0;font-weight:600;font-size:.9rem}
.res.g{color:var(--mast)}.res.a{color:var(--need)}
.q{margin:10px 0 14px}.q .qt{margin:0 0 4px;font-weight:600}
.prog{font-size:.8rem;color:var(--mute);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--mast);width:0;transition:width .25s}
.barlbl{font-size:.85rem;color:var(--mute);margin:0 0 6px}
.done{background:var(--mastbg);color:var(--mast);padding:10px 14px;border-radius:10px;font-weight:600;margin:12px 0}
.saved{font-size:.8rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.watch,.prac{margin:18px 0}
.anim svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.anim .t{fill:var(--ink);font:11px system-ui,sans-serif}
.s-water{fill:var(--water)}.s-mantle{fill:var(--mantle)}.s-cont{fill:var(--cont);stroke:var(--cont2);stroke-width:1}
.s-cont2{fill:var(--cont2)}.s-oc{fill:var(--oc)}.s-magma{fill:var(--magma)}.s-cn{fill:var(--cn)}.s-cr{fill:var(--cr)}
.s-slab{stroke:var(--oc)}.s-magmaline{stroke:var(--magma);stroke-width:4;stroke-dasharray:6 5;transition:opacity .3s}
.s-fossil{fill:#d1495b}.s-fossil2{fill:#2f9e6e}.s-band{stroke:#7a4fb5;stroke-width:6}
.s-mark{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.s-arrow path{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-fault{stroke:var(--magma);stroke-width:3;stroke-dasharray:8 5}.s-stream{stroke:#3a8fd1;stroke-width:6;stroke-linejoin:round}
.actl{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.actl .play{padding:7px 14px;font-size:.9rem;min-width:7.5em}
.sl{flex:1 1 180px;display:flex;flex-direction:column;font-size:.8rem;color:var(--mute);font-weight:600}
.sl input{width:100%;accent-color:var(--brand)}
.cap{margin:6px 0 0;font-size:.95rem;min-height:2.8em}.cap.hi{color:var(--mast);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:transparent;color:var(--brand);border:2px solid var(--brand);padding:6px 12px;font-size:.85rem}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff}
.cs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card)}
.cs p{margin:0 0 6px}.cs.ok{border-color:var(--mast);background:var(--mastbg)}
.cs .row button{background:transparent;color:var(--brand);border:2px solid var(--brand);padding:5px 10px;font-size:.85rem}
.cs .row button:disabled{opacity:.45;cursor:default}.cs .row button.right{background:var(--mast);border-color:var(--mast);color:#fff;opacity:1}
.dots{display:flex;gap:6px;margin:4px 0 10px}
.dots .d{width:14px;height:14px;border-radius:50%;background:var(--line);display:inline-block;transition:background .3s,transform .3s}
.dots .d.f{background:var(--mast);transform:scale(1.15)}.dots .d.l{background:var(--ok)}.dots .d.m{background:var(--need)}
.pq{font-weight:600;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:500;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{background:var(--mastbg);border-color:var(--mast);color:var(--mast);font-weight:700;animation:pop .35s}
.opt.reveal{border-color:var(--mast);border-style:dashed}
.opt.wrong{background:var(--needbg);border-color:var(--need);color:var(--need);text-decoration:line-through}
.opt:disabled:not(.right):not(.wrong):not(.reveal){opacity:.6}
.fb{margin:10px 0 0;font-weight:600}.fb.g{color:var(--mast)}.fb.a{color:var(--need)}
.reteach{border:2px solid var(--brand);border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--card);animation:slide .3s}
.rth{margin:0 0 4px;font-weight:700;color:var(--brand)}.tip{margin:0 0 8px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.shake,.opt.right,.reteach{animation:none}.dots .d,.s-magmaline{transition:none}}
@media (max-width:560px){.card>summary{flex-wrap:wrap;gap:6px 10px}.goal{flex-basis:100%;order:3}.card>summary::after{order:2}}
@media print{form,button,.hint{display:none}.card{break-inside:avoid}.card>summary::after{display:none}}
</style>
</head>
<body>
<main>
<section id="login">
  <h1>My Earth Science Review</h1>
  <p class="sub">Enter your student ID to see which learning targets to work on next, with a review for each one.</p>
  <form id="f" autocomplete="off">
    <label for="n" hidden>Student ID</label>
    <input id="n" type="text" inputmode="numeric" pattern="[0-9 \-]*" placeholder="Student ID number" required spellcheck="false">
    <button type="submit">Go</button>
  </form>
  <div id="err" class="msg" role="alert" hidden></div>
  <p class="hint">Your student ID is the 6-digit number in your school email (before the @). Not working? Ask Ms. Renick.</p>
</section>

<section id="plan" hidden>
  <div class="top"><h1 id="hello">Your review plan</h1><button class="ghost" id="back" type="button">Not me / switch</button></div>
  <p class="sub" id="lede"></p>
  <div id="out"></div>
  <p class="hint" id="built"></p>
</section>
</main>

<script>
const D=/*__DATA__*/null;

// Compact SHA-256 so lookup works on file:// and http:// alike.
function sha256(s){
  const K=[],H=[];let p=0;const ml=Math.pow(2,32);
  for(let c=2;p<64;c++){let ok=1;for(let q=2;q*q<=c;q++)if(c%q==0){ok=0;break}
    if(ok){if(p<8)H[p]=(Math.pow(c,.5)*ml)|0;K[p++]=(Math.pow(c,1/3)*ml)|0}}
  const b=new TextEncoder().encode(s),L=b.length*8,w=[];
  const pad=((b.length+9+63)>>6)<<6,bytes=new Uint8Array(pad);bytes.set(b);bytes[b.length]=0x80;
  const dv=new DataView(bytes.buffer);dv.setUint32(pad-4,L>>>0);dv.setUint32(pad-8,Math.floor(L/ml));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<pad;i+=64){
    for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){const a=w[j-15],c=w[j-2];
      w[j]=(w[j-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[j-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0}
    let [a,b2,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c)^(b2&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function norm(n){return String(n).replace(/\D/g,"")}
const key=n=>sha256(D.salt+norm(n)).slice(0,20);

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function status(v){
  if(v==="n")return{k:"need",o:0,pill:"Not taken yet"};
  if(typeof v==="number"){
    if(v<D.proficient)return{k:"need",o:1,pill:"Needs review · "+v.toFixed(1)+" / 4"};
    if(v<D.mastered)return{k:"ok",o:2,pill:"Proficient · "+v.toFixed(1)+" / 4"};
    return{k:"mast",o:3,pill:"Mastered · "+v.toFixed(1)+" / 4"};
  }
  return{k:"na",o:4,pill:"No score"};
}
function card(t,v,open){
  const s=status(v);
  const note=v==="n"?"You haven't taken this CFA yet. Work through the review below, then take the CFA to show what you know."
    :s.k==="need"?"Work through the review, then ask Ms. Renick about retaking the CFA."
    :s.k==="ok"?"You're proficient. Use this if you want to lock it in before the test."
    :s.k==="mast"?"Nice work. Skim this if you want a refresher.":"";
  return `<details class="card" data-i="${t.unit}:${t.id}"${open?" open":""}><summary><span class="tid">${esc(t.id)}</span><span class="goal">${esc(t.goal)}</span><span class="prog"></span><span class="pill ${s.k}">${esc(s.pill)}</span></summary>
  <div class="body"><div class="bar" aria-hidden="true"><i></i></div><p class="barlbl"></p>${t.html}<p class="cfa">${esc(note)}</p></div></details>`;
}

let curKey=null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const grow=ta=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight+2,400)+"px"};
function enhance(card,t){
  const sk="cfa:"+curKey+":"+t.unit+":"+t.id, uid=("r"+t.id).replace(/\W/g,"");
  const st=Object.assign({ans:{},rev:{},chk:{},q:{},p:{}},store.get(sk)||{});
  const save=()=>store.set(sk,st);
  const body=card.querySelector(".body");
  const P=D.practice&&D.practice[t.id];
  if(P){const a=document.createElement("div");a.className="watch";a.innerHTML='<h3>Watch and explore</h3><div class="stage"></div>';
    body.querySelector(".barlbl").after(a);mountAnim(P.anim,a.querySelector(".stage"),{});}
  const dets=[...body.querySelectorAll("details")];
  const checks=dets.length;
  // "Try it" checks: answer first, then reveal, then self-mark
  dets.forEach((d,i)=>{
    const sm=d.querySelector("summary");if(sm)sm.remove();
    const key=d.innerHTML,box=document.createElement("div");box.className="try";
    box.innerHTML=`<label for="${uid}a${i}">Your answer</label><textarea id="${uid}a${i}" rows="2" placeholder="Type your answer first, then check it."></textarea>
    <div class="row"><button type="button" class="chk">Check my answer</button></div>
    <div class="rev" hidden><div class="key"><strong>Answer:</strong> ${key}</div>
    <div class="row"><button type="button" class="got">I got it</button><button type="button" class="ghost again">Not yet</button></div></div><p class="res" aria-live="polite"></p>`;
    d.replaceWith(box);
    const ta=box.querySelector("textarea"),rev=box.querySelector(".rev"),res=box.querySelector(".res");
    const paint=()=>{rev.hidden=!st.rev[i];
      res.textContent=st.chk[i]==="got"?"✓ Got it":st.chk[i]==="again"?"Read the answer again, then try the next part.":"";
      res.className="res "+(st.chk[i]==="got"?"g":st.chk[i]==="again"?"a":"")};
    ta.value=st.ans[i]||"";grow(ta);paint();
    ta.addEventListener("input",()=>{st.ans[i]=ta.value;grow(ta);save()});
    box.querySelector(".chk").onclick=()=>{st.rev[i]=1;save();paint();prog()};
    box.querySelector(".got").onclick=()=>{st.chk[i]="got";save();paint();prog()};
    box.querySelector(".again").onclick=()=>{st.chk[i]="again";save();paint();prog()};
  });
  // final questions: write answers in boxes, copy to paste into Canvas
  let qn=0;
  const h3=[...body.querySelectorAll("h3")].find(h=>/^Show what you know/i.test(h.textContent));
  const ol=h3&&h3.nextElementSibling&&h3.nextElementSibling.tagName==="OL"?h3.nextElementSibling:null;
  if(ol){
    const wrap=document.createElement("div"),items=[...ol.children];qn=items.length;
    items.forEach((li,j)=>{
      const q=document.createElement("div");q.className="q";
      q.innerHTML=`<p class="qt">${j+1}. ${li.innerHTML}</p><label for="${uid}q${j}">Your answer</label><textarea id="${uid}q${j}" rows="3" placeholder="Answer in your own words."></textarea>`;
      const ta=q.querySelector("textarea");ta.value=st.q[j]||"";
      ta.addEventListener("input",()=>{st.q[j]=ta.value;grow(ta);save();prog()});
      wrap.appendChild(q);setTimeout(()=>grow(ta),0);
    });
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<button type="button" class="cp">Copy all my answers</button><span class="saved">Saved on this device as you type.</span>`;
    const cp=r.querySelector(".cp");
    cp.onclick=async()=>{
      const text=items.map((li,j)=>`${j+1}. ${li.textContent.trim()}\n${st.q[j]||""}`).join("\n\n");
      try{await navigator.clipboard.writeText(text);cp.textContent="Copied!"}
      catch(e){const ta=document.createElement("textarea");ta.value=text;wrap.appendChild(ta);ta.select();cp.textContent="Select and copy the text below"}
      setTimeout(()=>{cp.textContent="Copy all my answers"},2500)};
    wrap.appendChild(r);ol.replaceWith(wrap);
  }
  if(P){const pd=document.createElement("div");pd.className="prac";
    if(h3)h3.before(pd);else body.appendChild(pd);
    mountPractice(pd,t,P,st,save,()=>prog());}
  const pn=P?P.qs.length:0;
  const doneBox=document.createElement("div");doneBox.className="done";doneBox.hidden=true;
  doneBox.textContent="You finished this review. Paste your written answers into Canvas, then ask Ms. Renick about retaking the CFA.";
  body.appendChild(doneBox);
  const bar=body.querySelector(".bar i"),lbl=body.querySelector(".barlbl"),pg=card.querySelector(".prog");
  function prog(){
    const got=Object.values(st.chk).filter(v=>v==="got").length;
    const ans=Object.values(st.q).filter(v=>v&&v.trim().length>3).length;
    const pc=Object.values(st.p||{}).filter(v=>v==="first"||v==="later").length;
    const total=checks+qn+pn,done=got+Math.min(ans,qn)+pc;
    bar.style.width=(total?Math.round(100*done/total):0)+"%";
    lbl.textContent=`${pc} of ${pn} practice · ${got} of ${checks} checks · ${Math.min(ans,qn)} of ${qn} answers`;
    pg.textContent=done?`${done}/${total}`:"";
    doneBox.hidden=!(total&&done===total);
  }
  prog();
}
/*__ENGINE__*/
function show(row){
  const items=D.targets.map((t,i)=>({t,v:row[i]})).filter(x=>x.v!==null);
  const grp={0:[],1:[],2:[],3:[],4:[]};
  items.forEach(x=>grp[status(x.v).o].push(x));
  const need=grp[0].concat(grp[1]);
  const names=[["Start here",need,true],["Proficient: lock it in",grp[2],false],["Mastered",grp[3],false],["Not scored",grp[4],false]];
  let h="";
  for(const [title,list,open] of names){
    if(!list.length)continue;
    h+=`<h2>${title} (${list.length})</h2>`+list.map((x,i)=>card(x.t,x.v,open&&i===0)).join("");
  }
  $("lede").textContent=need.length
    ?`You have ${need.length} target${need.length>1?"s":""} to work on. Open one below, read it, try the checks, and answer the questions.`
    :"No targets need review right now. Nice work!";
  $("out").innerHTML=h;
  $("built").textContent="Updated "+D.built+". Scores change when you retake a CFA, so check back after Ms. Renick refreshes this page.";
  document.querySelectorAll("#out .card").forEach(c=>{const t=D.targets.find(x=>x.unit+":"+x.id===c.dataset.i);if(t)enhance(c,t)});
  $("login").hidden=true;$("plan").hidden=false;window.scrollTo(0,0);
}
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const typed=$("n").value,k=key(typed),row=D.students[k];curKey=k;
  if(!row){const m=$("err");m.hidden=false;
    m.textContent="I couldn't find that ID. Check the number and try again. Still stuck? Ask Ms. Renick.";return}
  $("err").hidden=true;
  show(row);
});
$("back").addEventListener("click",()=>{$("plan").hidden=true;$("login").hidden=false;$("n").value="";$("out").innerHTML="";$("n").focus()});
</script>
</body>
</html>
