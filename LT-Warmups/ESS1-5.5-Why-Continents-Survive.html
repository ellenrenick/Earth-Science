<title>Subduction Warm-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered column, one question per screen, reteach card appears under the answer. */
:root{
  --bg:#eef4f4; --surface:#ffffff; --fg:#0f2f3a; --muted:#4d6670; --line:#c9d9dc;
  --accent:#0b6e7f; --accent-fg:#ffffff; --gold:#f0b429; --gold-bg:#fff4d1;
  --good:#1d7a46; --good-bg:#e2f4e8; --bad:#b3341f; --bad-bg:#fbe7e2;
  --rock-ocean:#34495a; --rock-cont:#c9a66b; --mantle:#e08a4a; --water:#bfe3ee; --ink-on-rock:#ffffff;
  --font-head:'Space Grotesk','Segoe UI',system-ui,sans-serif; --font-body:'Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1d24; --surface:#13303a; --fg:#e6f1f3; --muted:#9db6bd; --line:#27494f;
  --accent:#49b8cc; --accent-fg:#06222a; --gold:#f0b429; --gold-bg:#3b3214;
  --good:#6fd193; --good-bg:#12382a; --bad:#ff9d8a; --bad-bg:#432019;
  --rock-ocean:#5c7a8f; --rock-cont:#b39057; --mantle:#c26d32; --water:#1d4b5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1d24; --surface:#13303a; --fg:#e6f1f3; --muted:#9db6bd; --line:#27494f;
  --accent:#49b8cc; --accent-fg:#06222a; --gold:#f0b429; --gold-bg:#3b3214;
  --good:#6fd193; --good-bg:#12382a; --bad:#ff9d8a; --bad-bg:#432019;
  --rock-ocean:#5c7a8f; --rock-cont:#b39057; --mantle:#c26d32; --water:#1d4b5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;min-width:0}
.target{background:var(--gold-bg);border-left:4px solid var(--gold);padding:10px 14px;border-radius:4px;font-size:.95rem}
label.field{display:grid;gap:4px;font-weight:500;font-size:.95rem}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
button{font:inherit;cursor:pointer;border-radius:6px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;padding:11px 18px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--gold)}
.q{font-size:1.15rem;font-weight:600}
.opts{display:grid;gap:10px;border:0;padding:0;margin:0;min-width:0}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent)}
.opt.struck{opacity:.5;text-decoration:line-through;cursor:not-allowed}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--good-bg);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb strong{font-family:var(--font-head)}
.reteach{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.reteach svg{width:100%;height:auto;max-width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font:700 3rem var(--font-head);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:600;font-size:.9rem;background:var(--gold-bg);border:1px solid var(--gold)}
.recap{display:grid;gap:8px}
.recap div{display:flex;gap:10px;align-items:baseline}
.tag{flex:none;font-size:.75rem;font-weight:600;border-radius:4px;padding:2px 8px;min-width:96px;text-align:center}
.tag.first{background:var(--good-bg);color:var(--good)} .tag.second{background:var(--gold-bg);color:var(--fg)} .tag.miss{background:var(--bad-bg);color:var(--bad)}
.line{font:.85rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;word-break:break-word;user-select:all}
.note{font-size:.88rem;color:var(--muted)}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:2px}
.stat b{font:700 1.6rem var(--font-head)}
@media (prefers-reduced-motion:no-preference){.fb,.reteach{animation:rise .25s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}}}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ---------- Content for this learning target (swap this block to make a warm-up for another target) ---------- */
const LT = {
  id: "4.5", code: "ESS1-5.5", title: "Subduction Warm-Up",
  target: "I can explain why ocean crust sinks at subduction zones but less-dense continental crust survives."
};
/* Score of record = number answered correctly on the FIRST try, mapped to the 4-point scale. */
const BANDS = [
  {min:5, score:3.5, label:"Mastered",        say:"You can explain this clearly and use it in new situations."},
  {min:4, score:2.7, label:"Proficient",      say:"You can explain it. Check the one idea you missed."},
  {min:3, score:1.8, label:"Approaching",     say:"You have part of it. Review the reteach cards below, then ask your teacher for next steps."},
  {min:0, score:0.9, label:"Not yet meeting", say:"This target needs more work. Read the reteach cards below, then talk with your teacher."}
];
const bandFor = n => BANDS.find(b => n >= b.min);

const DIAGRAM = "subduction", AGES = "ages";
const ITEMS = [
 { id:"q1", text:"Which type of crust is denser?", correct:"ocean",
   opts:[
    {id:"cont", text:"Continental crust", fb:"Many people pick continental crust because continents are thick and look heavy. Thickness is not density. Density is how much mass is packed into each cubic centimeter."},
    {id:"ocean", text:"Oceanic crust"},
    {id:"same", text:"They have the same density", fb:"They are different rocks. Oceanic crust is dark basalt. Continental crust is lighter rock, like granite. Different rocks pack different amounts of mass into the same space."},
    {id:"weather", text:"It depends on the weather", fb:"Weather happens at the surface and does not change the rock underneath. Density depends on what the rock is made of."}],
   why:"Oceanic crust is dark basalt, about 3.0 g/cm³. Continental crust is lighter rock like granite, about 2.7 g/cm³.",
   reteach:{title:"Compare the two crusts", body:"Density is mass in a given volume. Oceanic crust is about 3.0 g/cm³ and continental crust is about 2.7 g/cm³. When two materials meet, the denser one goes under, like the dark rock in the density lab.", fig:DIAGRAM}},
 { id:"q2", text:"What happens when dense oceanic crust meets less-dense continental crust at a convergent boundary?", correct:"oc-sinks",
   opts:[
    {id:"oc-sinks", text:"The oceanic crust sinks under the continental crust."},
    {id:"cc-sinks", text:"The continental crust sinks under the oceanic crust.", fb:"You have it reversed. When two materials meet, the denser one goes under. Continental crust is the less dense one."},
    {id:"both", text:"Both crusts sink equally.", fb:"They do not sink equally. The difference in density decides which one goes under."},
    {id:"neither", text:"Neither crust moves.", fb:"The plates keep pushing together, so something has to give. The denser ocean plate bends down into the mantle, and a trench marks the spot."}],
   why:"The dense oceanic plate sinks (subducts) under the lighter continental plate. A trench forms where it bends down.",
   reteach:{title:"What happens at the collision", body:"At a convergent boundary the ocean plate is the denser plate, so it bends down and sinks into the mantle. This is subduction. A trench forms where the plate bends.", fig:DIAGRAM}},
 { id:"q3", text:"Why does continental crust usually NOT sink into the mantle at subduction zones?", correct:"buoyant",
   opts:[
    {id:"cold", text:"It is too cold.", fb:"Cold actually makes ocean crust denser, so it sinks more easily. Continental crust stays up because it is less dense, not because of its temperature."},
    {id:"thin", text:"It is too thin.", fb:"It is the other way around. Continental crust is thicker than oceanic crust. Thickness is not the reason. Its lower density is."},
    {id:"fast", text:"It is moving too fast.", fb:"Plates move only a few centimeters a year, and speed does not decide this. The continent stays high because it is less dense."},
    {id:"buoyant", text:"It is less dense and too buoyant to sink."}],
   why:"Continental crust is less dense (about 2.7 g/cm³) and too buoyant to be pulled down, so it stays at the surface.",
   reteach:{title:"Why the continent stays on top", body:"Think of wood and dark rock in water. The less dense wood floats and the denser rock sinks. Continental crust is the wood. It is too buoyant to be pulled into the mantle.", fig:DIAGRAM}},
 { id:"q4", text:"True or false: The oldest rocks on Earth are found on the ocean floor.", correct:"f", fixed:true,
   opts:[
    {id:"t", text:"True", fb:"It is the opposite. The ocean floor is young because it keeps getting recycled. The oldest rocks are on the continents, nearly 4 billion years old."},
    {id:"f", text:"False"}],
   why:"The oldest rocks are on the continents (nearly 4 billion years old). Seafloor rock is much younger, under about 200 million years.",
   reteach:{title:"Where the oldest rocks are", body:"Ocean crust is recycled at trenches, so seafloor rock is young. Continental crust is not recycled, so some continental rock is billions of years old.", fig:AGES}},
 { id:"q5", text:"No seafloor rock is older than about 200 million years. What is the best explanation?", correct:"recycled",
   opts:[
    {id:"water", text:"Ocean water dissolves old rock.", fb:"Water can wear away some rock at the surface, but it cannot remove whole plates of ocean crust. Recycling at trenches does."},
    {id:"recycled", text:"Old ocean crust sinks back into the mantle at trenches, so it does not last."},
    {id:"young-ocean", text:"The oceans are only 200 million years old.", fb:"The ocean water is billions of years old. It is the seafloor rock that is young, because it keeps getting replaced."},
    {id:"continents", text:"Old ocean crust turns into continents.", fb:"Old ocean crust mostly sinks into the mantle at trenches. It does not pile up to make continents."}],
   why:"Old, dense ocean crust sinks back into the mantle at trenches, so no seafloor rock lasts much longer than about 200 million years.",
   reteach:{title:"Why the seafloor is young", body:"New ocean crust forms at ridges and old ocean crust sinks at trenches. The seafloor is always being recycled, so none of it gets very old.", fig:DIAGRAM}}
];

/* ---------- Diagrams ---------- */
function svgSubduction(){return `<svg viewBox="0 0 640 300" role="img" aria-label="Cross-section: the dense ocean plate bends down at a trench and sinks under the lighter continental plate into the mantle.">
 <rect x="0" y="110" width="640" height="190" fill="var(--mantle)" opacity=".75"/>
 <rect x="0" y="70" width="256" height="42" fill="var(--water)"/>
 <polygon points="0,110 240,110 520,260 520,284 240,134 0,134" fill="var(--rock-ocean)"/>
 <polygon points="255,45 640,45 640,170 360,170 300,140 255,118" fill="var(--rock-cont)"/>
 <polygon points="410,45 430,22 450,45" fill="var(--rock-cont)"/>
 <path d="M300 150 L440 228" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#ah)"/>
 <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="var(--fg)"/></marker></defs>
 <g font-family="Inter,system-ui,sans-serif" font-size="13" fill="var(--fg)">
  <text x="12" y="96">Ocean water</text>
  <text x="170" y="104" font-weight="600">Trench</text>
  <text x="12" y="165" font-weight="600">Oceanic crust</text>
  <text x="12" y="183">dark basalt, about 3.0 g/cm³</text>
  <text x="12" y="201">MORE dense: it sinks</text>
  <text x="270" y="82" fill="#1d1608" font-weight="600">Continental crust</text>
  <text x="270" y="100" fill="#1d1608">lighter rock, about 2.7 g/cm³</text>
  <text x="270" y="118" fill="#1d1608">LESS dense: too buoyant to sink</text>
  <text x="456" y="214" font-weight="600">sinking plate</text>
  <text x="12" y="284">Mantle</text>
  <text x="455" y="14" font-size="12">volcano</text>
 </g></svg>`}
function svgAges(){return `<svg viewBox="0 0 640 140" role="img" aria-label="Bar chart to scale: oldest continental rock is nearly 4 billion years old; oldest seafloor is about 0.2 billion years.">
 <g font-family="Inter,system-ui,sans-serif" font-size="13" fill="var(--fg)">
  <text x="0" y="22" font-weight="600">Oldest continental rock</text>
  <rect x="0" y="30" width="560" height="22" fill="var(--rock-cont)"/><text x="566" y="46">about 4 billion yr</text>
  <text x="0" y="82" font-weight="600">Oldest seafloor rock</text>
  <rect x="0" y="90" width="28" height="22" fill="var(--rock-ocean)"/><text x="36" y="106">about 0.2 billion yr (200 million)</text>
  <text x="0" y="134" font-size="12" fill="var(--muted)">Bars drawn to the same scale.</text>
 </g></svg>`}
const FIG = {subduction:svgSubduction, ages:svgAges};

/* ---------- State ---------- */
const $app = document.getElementById("app");
const S = { screen:"start", name:"", period:"", i:0, rec:[], sel:null, phase:"answer", order:{}, saved:"", viewer:null, db:null, user:null, dl:null, isTeacher:false, rows:null, filter:"all" };
try{ S.name = localStorage.getItem("wu_name")||""; S.period = localStorage.getItem("wu_period")||""; }catch(e){}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const header = (extra="") => `<div class="top"><div><div class="eyebrow">${LT.code} · Warm-up</div><h1>${esc(LT.title)}</h1></div>${extra}</div>`;

/* ---------- Screens ---------- */
function render(){
  if(S.screen==="start") return renderStart();
  if(S.screen==="quiz") return renderQuiz();
  if(S.screen==="done") return renderDone();
  if(S.screen==="teacher") return renderTeacher();
}
function renderStart(){
  $app.innerHTML = `${header(S.isTeacher?'<button class="btn ghost" id="tview">Teacher results</button>':'')}
  <div class="target"><strong>Learning target ${LT.code}:</strong> ${esc(LT.target)}</div>
  <div class="card">
    <p>Answer 5 questions. After each one you get feedback right away. If you miss one, you will see a quick reteach and get a second try. Your <strong>first try</strong> is what shows your teacher where to help, so answer on your own.</p>
    <label class="field" for="nm">First name and last initial<input type="text" id="nm" autocomplete="off" value="${esc(S.name)}"></label>
    <label class="field" for="pd">Class period<input type="text" id="pd" autocomplete="off" value="${esc(S.period)}" placeholder="Example: 3"></label>
    <div class="actions"><button class="btn" id="go">Start warm-up</button></div>
  </div>`;
  const go = document.getElementById("go"), nm = document.getElementById("nm"), pd = document.getElementById("pd");
  const check = () => go.disabled = !(nm.value.trim() && pd.value.trim());
  nm.oninput = pd.oninput = check; check();
  go.onclick = () => { S.name = nm.value.trim(); S.period = pd.value.trim(); try{localStorage.setItem("wu_name",S.name);localStorage.setItem("wu_period",S.period);}catch(e){}
    S.screen="quiz"; S.i=0; S.rec=[]; S.saved=""; S.phase="answer"; S.sel=null; S.order={}; render(); };
  const t = document.getElementById("tview"); if(t) t.onclick = openTeacher;
}
function optsFor(it){ if(!S.order[it.id]) S.order[it.id] = it.fixed ? it.opts.map(o=>o.id) : shuffle(it.opts).map(o=>o.id); return S.order[it.id].map(id=>it.opts.find(o=>o.id===id)); }
function renderQuiz(){
  const it = ITEMS[S.i], rec = S.rec[S.i] || (S.rec[S.i] = {id:it.id, first:null, second:null});
  const tries = rec.first===null ? 0 : 1;
  const locked = S.phase!=="answer";
  const bars = ITEMS.map((_,k)=>`<span class="${k<S.i?'done':k===S.i?'now':''}"></span>`).join("");
  const opts = optsFor(it).map(o=>{
    const struck = rec.first && rec.first.choice===o.id && S.phase==="answer";
    let cls = "opt"; if(struck) cls+=" struck"; else if(S.sel===o.id && !locked) cls+=" sel";
    if(locked){ if(o.id===it.correct && S.phase!=="wrong1") cls+=" right"; else if((rec.second&&rec.second.choice===o.id)||(!rec.second&&rec.first&&rec.first.choice===o.id)) cls+=" wrong"; }
    return `<label class="${cls}"><input type="radio" name="o" value="${o.id}" ${S.sel===o.id?'checked':''} ${(locked||struck)?'disabled':''}><span>${esc(o.text)}</span></label>`;}).join("");
  let panel = "";
  if(S.phase==="right1") panel = `<div class="fb good"><strong>Correct!</strong><p>${esc(it.why)}</p></div>`;
  if(S.phase==="wrong1"){ const ch = it.opts.find(o=>o.id===rec.first.choice);
    panel = `<div class="fb bad"><strong>Not quite.</strong><p>${esc(ch.fb)}</p></div>
      <div class="reteach"><h3>Quick reteach: ${esc(it.reteach.title)}</h3><p>${esc(it.reteach.body)}</p>${FIG[it.reteach.fig]()}</div>`; }
  if(S.phase==="right2") panel = `<div class="fb good"><strong>Yes, that's it.</strong><p>${esc(it.why)}</p></div>`;
  if(S.phase==="wrong2") panel = `<div class="fb bad"><strong>The answer is: ${esc(it.opts.find(o=>o.id===it.correct).text)}</strong><p>${esc(it.why)}</p><p class="note">Bring this one to your teacher or a partner.</p></div>`;
  const last = S.i===ITEMS.length-1;
  let btn = "";
  if(S.phase==="answer") btn = `<button class="btn" id="chk" ${S.sel?'':'disabled'}>${tries?'Check second try':'Check answer'}</button>`;
  else if(S.phase==="wrong1") btn = `<button class="btn" id="retry">Try again</button>`;
  else btn = `<button class="btn" id="next">${last?'See my score':'Next question'}</button>`;
  $app.innerHTML = `${header(`<span class="note">Question ${S.i+1} of ${ITEMS.length}</span>`)}
   <div class="progress" aria-hidden="true">${bars}</div>
   <div class="card"><p class="q">${esc(it.text)}</p><fieldset class="opts"><legend class="note">Choose one answer</legend>${opts}</fieldset>${panel}<div class="actions">${btn}</div></div>`;
  document.querySelectorAll('input[name=o]').forEach(r=>r.onchange=()=>{S.sel=r.value; render(); const c=document.querySelector('input[name=o]:checked'); if(c) c.focus();});
  const chk = document.getElementById("chk");
  if(chk) chk.onclick = () => { const ok = S.sel===it.correct;
    if(!rec.first){ rec.first={choice:S.sel,correct:ok}; S.phase = ok?"right1":"wrong1"; }
    else { rec.second={choice:S.sel,correct:ok}; S.phase = ok?"right2":"wrong2"; }
    S.sel = rec.second||ok ? S.sel : null; render(); };
  const rt = document.getElementById("retry"); if(rt) rt.onclick = () => { S.phase="answer"; S.sel=null; render(); };
  const nx = document.getElementById("next"); if(nx) nx.onclick = () => { if(last){ S.screen="done"; finish(); } else { S.i++; S.phase="answer"; S.sel=null; } render(); window.scrollTo(0,0); };
}

/* ---------- Scoring and saving ---------- */
function summary(){
  const first = S.rec.filter(r=>r.first&&r.first.correct).length;
  const recovered = S.rec.filter(r=>r.first&&!r.first.correct&&r.second&&r.second.correct).length;
  const b = bandFor(first);
  return {first, recovered, score:b.score, band:b.label, say:b.say};
}
function resultLine(){
  const s = summary();
  const items = S.rec.map((r,k)=>`Q${k+1}${r.first.correct?"✓":(r.second&&r.second.correct?"~":"✗")}`).join(" ");
  return `${LT.code} | ${S.name} | Period ${S.period} | Score ${s.score} (${s.band}) | ${s.first}/5 first try | ${items}`;
}
async function finish(){
  const s = summary();
  const rec = { lt:LT.code, name:S.name, period:S.period, score:s.score, band:s.band, firstTry:s.first, recovered:s.recovered,
    items:S.rec.map((r,k)=>({q:ITEMS[k].id, first:r.first.choice, firstOk:r.first.correct, second:r.second?r.second.choice:null, secondOk:r.second?r.second.correct:null})),
    at:new Date().toISOString() };
  S.saved = "saving";
  try{
    if(!S.db || !S.viewer) throw new Error("no-db");
    const ref = S.db.doc("results/"+S.viewer);
    const snap = await ref.get(); const prev = snap.exists ? (snap.data().attempts||[]) : [];
    await ref.set({ latest:rec, attempts:prev.concat([rec]).slice(-5), name:S.name, period:S.period, lt:LT.code });
    S.saved = "ok";
  }catch(e){ S.saved = "no"; }
  if(S.screen==="done") renderDone();
}
function renderDone(){
  const s = summary();
  const recap = S.rec.map((r,k)=>{ const cls = r.first.correct?"first":(r.second&&r.second.correct?"second":"miss");
    const lab = r.first.correct?"Right 1st try":(r.second&&r.second.correct?"Right 2nd try":"Needs review");
    return `<div><span class="tag ${cls}">${lab}</span><span>${esc(ITEMS[k].text)}</span></div>`; }).join("");
  const review = S.rec.map((r,k)=>r.first.correct?"":`<li><strong>${esc(ITEMS[k].reteach.title)}.</strong> ${esc(ITEMS[k].why)}</li>`).join("");
  const savedMsg = S.saved==="ok" ? "Your score was sent to your teacher." : S.saved==="saving" ? "Sending your score…" :
     "Your score could not be sent automatically. Copy the line below and paste it into the Canvas assignment.";
  $app.innerHTML = `${header()}
  <div class="card"><div class="score"><b>${s.score}</b><span>out of 4</span><span class="pill">${s.band}</span></div>
   <p>${esc(s.say)}</p><p class="note">${s.first} of 5 right on the first try. ${s.recovered?`${s.recovered} more right after the reteach.`:""}</p></div>
  <div class="card"><h2>Your answers</h2><div class="recap">${recap}</div></div>
  ${review?`<div class="card"><h2>Ideas to review</h2><ul>${review}</ul></div>`:""}
  <div class="card"><h2>Your result</h2><p class="note" id="svmsg">${savedMsg}</p><div class="line" id="rl">${esc(resultLine())}</div>
   <div class="actions"><button class="btn ghost" id="cp">Copy result line</button><button class="btn ghost" id="again">Take it again</button></div><p class="note" id="cpm"></p></div>`;
  document.getElementById("cp").onclick = async () => { const t = resultLine(); const m = document.getElementById("cpm");
    try{ await navigator.clipboard.writeText(t); m.textContent="Copied."; }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("rl")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); m.textContent="Press Ctrl+C (or hold and tap Copy) to copy the selected line."; } };
  document.getElementById("again").onclick = () => { S.screen="start"; render(); };
}

/* ---------- Teacher view (only for people who can edit the page) ---------- */
async function openTeacher(){ S.screen="teacher"; S.rows=null; render(); await loadRows(); render(); }
async function loadRows(){
  try{ const snap = await S.db.collection("results").get(); S.rows = snap.docs.map(d=>d.data()).filter(d=>d&&d.latest); }
  catch(e){ S.rows = []; S.err = "Could not read results."; }
}
function csv(rows){
  const head = ["name","period","lt","score","band","first_try_correct","recovered_after_reteach","attempts","completed_at", ...ITEMS.flatMap(i=>[i.id+"_first_choice",i.id+"_first_correct"])];
  const q = v => '"'+String(v??"").replace(/"/g,'""')+'"';
  const lines = rows.map(r=>{ const l=r.latest; return [r.name,r.period,r.lt,l.score,l.band,l.firstTry,l.recovered,(r.attempts||[]).length,l.at,...ITEMS.flatMap(i=>{const x=(l.items||[]).find(z=>z.q===i.id)||{}; return [x.first,x.firstOk];})].map(q).join(","); });
  return [head.map(q).join(","),...lines].join("\n");
}
function renderTeacher(){
  const all = S.rows, periods = all ? [...new Set(all.map(r=>r.period))].sort() : [];
  const rows = all ? all.filter(r=>S.filter==="all"||r.period===S.filter).sort((a,b)=>String(a.name).localeCompare(String(b.name))) : [];
  const n = rows.length, avg = n ? (rows.reduce((s,r)=>s+r.latest.score,0)/n).toFixed(2) : "–";
  const dist = BANDS.slice().reverse().map(b=>({b, c:rows.filter(r=>r.latest.score===b.score).length}));
  const itemStats = ITEMS.map(it=>{ const xs = rows.map(r=>(r.latest.items||[]).find(z=>z.q===it.id)).filter(Boolean);
    const ok = xs.filter(x=>x.firstOk).length; const wrong = {}; xs.filter(x=>!x.firstOk).forEach(x=>wrong[x.first]=(wrong[x.first]||0)+1);
    const top = Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0]; const topText = top ? it.opts.find(o=>o.id===top[0]).text+" ("+top[1]+")" : "–";
    return {it, pct:xs.length?Math.round(100*ok/xs.length):0, has:xs.length, topText}; });
  $app.innerHTML = `${header('<button class="btn ghost" id="back">Back to warm-up</button>')}
  ${all===null?'<div class="card"><p>Loading results…</p></div>':`
  <div class="card"><div class="actions"><label class="field" for="pf" style="min-width:160px">Period<select id="pf" style="font:inherit;padding:8px;border-radius:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line)"><option value="all">All periods</option>${periods.map(p=>`<option ${S.filter===p?'selected':''}>${esc(p)}</option>`).join("")}</select></label>
   <button class="btn ghost" id="rf">Refresh</button>${S.dl&&n?'<button class="btn" id="dl">Download CSV</button>':""}</div>
   ${n?"":'<p class="note">No results yet. They appear here after students finish the warm-up while signed in to the page.</p>'}</div>
  ${n?`<div class="grid2"><div class="stat"><span class="note">Students</span><b>${n}</b></div><div class="stat"><span class="note">Class average (of 4)</span><b>${avg}</b></div>
   ${dist.map(d=>`<div class="stat"><span class="note">${d.b.label} (${d.b.score})</span><b>${d.c}</b></div>`).join("")}</div>
  <div class="card"><h2>Which ideas to reteach</h2><p class="note">Share right on the first try, and the wrong answer students chose most.</p><div class="scroller"><table><thead><tr><th>Question</th><th>First-try correct</th><th></th><th>Most common wrong answer</th></tr></thead><tbody>
   ${itemStats.map((s,k)=>`<tr><td>Q${k+1} · ${esc(s.it.text.slice(0,48))}…</td><td>${s.pct}%</td><td><div class="bar"><i style="width:${s.pct}%"></i></div></td><td>${esc(s.topText)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>Scores</h2><div class="scroller"><table><thead><tr><th>Name</th><th>Period</th><th>Score</th><th>Band</th><th>1st try</th>${ITEMS.map((_,k)=>`<th>Q${k+1}</th>`).join("")}</tr></thead><tbody>
   ${rows.map(r=>{const l=r.latest; return `<tr><td>${esc(r.name)}</td><td>${esc(r.period)}</td><td>${l.score}</td><td>${esc(l.band)}</td><td>${l.firstTry}/5</td>${ITEMS.map(it=>{const x=(l.items||[]).find(z=>z.q===it.id)||{}; return `<td>${x.firstOk?"✓":(x.secondOk?"~":"✗")}</td>`;}).join("")}</tr>`}).join("")}</tbody></table></div>
   <p class="note">✓ right first try · ~ right after reteach · ✗ still missed. Score of record uses the first try: 5 = 3.5, 4 = 2.7, 3 = 1.8, 0 to 2 = 0.9.</p></div>`:""}`}`;
  document.getElementById("back").onclick = () => { S.screen="start"; render(); };
  const rf = document.getElementById("rf"); if(rf) rf.onclick = async () => { S.rows=null; render(); await loadRows(); render(); };
  const pf = document.getElementById("pf"); if(pf) pf.onchange = () => { S.filter = pf.value; render(); };
  const dl = document.getElementById("dl"); if(dl) dl.onclick = () => S.dl.save({filename:`warmup-${LT.code}-results.csv`, data:csv(rows)}).catch(()=>{});
}

/* ---------- Boot: the page works on its own; capabilities light up extras ---------- */
render();
(async()=>{
  try{ if(window.claude){
    S.db = await claude.use("db"); S.user = await claude.use("user"); S.dl = await claude.use("downloads");
    if(S.user){ S.viewer = await S.user.id(); S.isTeacher = !!(S.db && await S.user.canEdit()); }
    if(S.screen==="start") render();
  }}catch(e){}
})();
</script>
